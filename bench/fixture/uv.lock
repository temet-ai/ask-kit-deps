version = 1
revision = 1
requires-python = ">=3.12"

[[package]]
name = "l-space"
version = "0.2.1"
source = { registry = "https://pypi.example.com/simple" }
sdist = { url = "https://files.example.com/l_space-0.2.1.tar.gz", hash = "sha256:0000", size = 1024 }

[[package]]
name = "ook"
version = "1.3.0"
source = { registry = "https://pypi.example.com/simple" }
dependencies = [
    { name = "l-space" },
]
sdist = { url = "https://files.example.com/ook-1.3.0.tar.gz", hash = "sha256:0000", size = 2048 }

[[package]]
name = "rincewind"
version = "0.1.4"
source = { registry = "https://pypi.example.com/simple" }

[[package]]
name = "unseen-university"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "ook" },
    { name = "rincewind" },
]

[package.dev-dependencies]
dev = [
    { name = "l-space" },
]

[package.metadata]
requires-dist = [
    { name = "ook", specifier = ">=1.2" },
    { name = "rincewind", specifier = ">=0.1" },
]
